<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#131318">
<meta name="robots" content="noindex">
<title>404 — Senem Kurtulmus</title>
<!-- Chemins absolus : cette page peut s'afficher depuis n'importe quelle URL inconnue -->
<link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#131318;--ink:#f0eff7;--muted:#aaa8ba;--purple:#c0bdff;--line:rgba(255,255,255,.105);--mono:"JetBrains Mono",monospace;--sans:"Geist",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:32px 20px;background:radial-gradient(ellipse 60% 50% at 50% 38%,rgba(192,189,255,.1),transparent 70%),var(--bg);color:var(--ink);font-family:var(--sans);text-align:center;overflow-x:clip}
.logo{height:54px;width:auto;margin-bottom:34px;opacity:.95}
.code{font:600 clamp(88px,22vw,170px)/1 var(--sans);letter-spacing:-.06em;margin:0;background:linear-gradient(180deg,var(--ink),rgba(192,189,255,.35));-webkit-background-clip:text;background-clip:text;color:transparent}
.kicker{font:12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--purple);margin:14px 0 10px}
h1{font-size:clamp(24px,5vw,34px);letter-spacing:-.03em;margin:0 0 12px}
p{max-width:460px;margin:0 0 30px;color:var(--muted);line-height:1.65;font-size:16px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 20px;border-radius:5px;background:var(--purple);color:#171620;text-decoration:none;font:600 12px var(--mono);border:1px solid var(--purple);transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-2px);background:#d4d2ff}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media(prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover{transform:none}}
</style>
</head>
<body>
<img class="logo" src="/images/logo-nav.png" alt="" width="54" height="54">
<div class="code" aria-hidden="true">404</div>
<div class="kicker" id="kicker">Page introuvable</div>
<h1 id="title">Oups, cette page n’existe pas.</h1>
<p id="text">Le lien est peut-être erroné ou la page a été déplacée. Revenez à l’accueil pour découvrir mes projets.</p>
<a class="btn" id="home" href="/">Retour à l’accueil <span aria-hidden="true">↗</span></a>
<script>
(function(){
  var lang="fr";
  try{lang=localStorage.getItem("lang")||(/^fr/i.test(navigator.language)?"fr":"en")}catch(e){}
  if(lang!=="en")return;
  document.documentElement.lang="en";
  document.title="404 — Senem Kurtulmus";
  document.getElementById("kicker").textContent="Page not found";
  document.getElementById("title").textContent="Oops, this page doesn’t exist.";
  document.getElementById("text").textContent="The link may be wrong or the page may have moved. Head back home to see my projects.";
  document.getElementById("home").innerHTML="Back to home <span aria-hidden=\"true\">↗</span>";
})();
</script>
</body>
</html>
